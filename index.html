<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landingpage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-full h-screen relative">
      <header
        class="w-full h-[90px] bg-[#F2F4F2] flex border-b border-[#E0E0E0]"
      >
        <div class="w-[25%] h-full flex items-center justify-center gap-[10px]">
          <div
            class="w-[40px] h-[40px] bg-[#0D6E4F] rounded-[5px] flex items-center justify-center text-white font-bold font-size-[30px]"
          >
            H
          </div>
          <div class="font-bold text-[20px]">Halvorn</div>
        </div>
        <div class="w-[50%] h-full">
          <nav
            class="w-full h-full flex items-center justify-center gap-[30px] text-[15px] text-[#89918C]"
          >
            <a href="" class="font-bold text-black">Home</a>
            <a href="">Services</a>
            <a href="">Work</a>
            <a href="">About</a>
            <a href="">Contact</a>
          </nav>
        </div>
        <div class="w-[25%] h-full flex items-center justify-center gap-[20px]">
          <button
            class="w-[150px] h-[50px] rounded-md border-[1px] border-[#89918C] font-bold cursor-pointer"
          >
            Client Login
          </button>
          <button
            class="w-[150px] h-[50px] rounded-md border-[1px] border-[#0D6E4F] bg-[#0D6E4F] text-white cursor-pointer hover:bg-white hover:text-[#0D6E4F] transition-all duration-300 ease"
          >
            Book a call
          </button>
        </div>
      </header>
      <main class="w-full h-[100%] bg-red-500 absolute top-[0px] z-[-1]"></main>
    </div>
  </body>
</html>
